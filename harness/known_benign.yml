# Known-benign patterns: hits that match an entry here are auto-closed by harness/enrich.py.
#
# Every entry MUST have a written reason. An auto-close without a reason is how real
# attacks get silently dismissed. Review this list like code: each entry is a blind spot.
#
# Format:
#   - name: short id
#     reason: why this is expected and safe
#     rules: [optional list of rule titles this entry applies to; omit = all rules]
#     match:              # same syntax as a Sigma selection
#       FieldName: value
#
# An alert is only auto-closed if EVERY event in it matches the same entry.

- name: federated-admins-console-key-provisioning
  reason: >
    The cloud team provisions IAM access keys for service and team accounts from the AWS
    console after signing in through the company IdP (Okta) into the okta_adm_role
    admin role. That role requires IdP MFA and is limited to the cloud team, so a key
    created this way is an approved admin action. Keys created any other way (CLI,
    long-lived IAM user keys, root) stay open for review.
  rules:
    - AWS Access Key Created for a Different IAM User
  match:
    userIdentity.type: AssumedRole
    userIdentity.arn|contains: ':assumed-role/okta_adm_role/'
    userAgent: console.amazonaws.com
