<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detection Lab Results</title>
<meta name="description" content="Real attack telemetry replayed through 13 detection rules: watch the attacks, the alerts, the triage, and the reasoning behind every match.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Atkinson+Hyperlegible+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/*
  Design notes
  - Red = attacker, blue = defender (the red team / blue team vocabulary of the field).
    Grey = ordinary activity. Validated with the dataviz palette script in both themes.
  - One typeface family (Atkinson Hyperlegible, built for legibility); its mono sibling is
    used only for real log text and rule code, never for labels.
  - The memorable element is the evidence strip in the hero. Everything else stays quiet.
*/
:root {
  color-scheme: light;
  --surface: #f4f5f7;
  --panel: #ffffff;
  --sunken: #eceef2;
  --ink: #1d2433;
  --ink-2: #4b5466;
  --muted: #5f6878;
  --rule: #d5d9df;
  --tick: #7d8592;
  --attack: #e34948;
  --attack-text: #b42f2e;
  --defend: #2a78d6;
  --defend-text: #1c5cab;
  --defend-wash: #e3eefb;
  --focus: #1c5cab;
  --sans: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface: #191c22; --panel: #20242c; --sunken: #262b34;
    --ink: #eceef2; --ink-2: #c2c8d2; --muted: #99a1ae; --rule: #343a45; --tick: #6f7785;
    --attack: #e66767; --attack-text: #f09494; --defend: #3987e5; --defend-text: #86b6ef;
    --defend-wash: #1d2b40; --focus: #86b6ef;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #191c22; --panel: #20242c; --sunken: #262b34;
  --ink: #eceef2; --ink-2: #c2c8d2; --muted: #99a1ae; --rule: #343a45; --tick: #6f7785;
  --attack: #e66767; --attack-text: #f09494; --defend: #3987e5; --defend-text: #86b6ef;
  --defend-wash: #1d2b40; --focus: #86b6ef;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--surface); color: var(--ink); font: 400 16px/1.55 var(--sans); }
a { color: var(--defend-text); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
button { font: inherit; color: inherit; }
code, pre, .log { font-family: var(--mono); }
h1, h2, h3, p { margin: 0; }

/* ---- top bar ---- */
.bar { border-bottom: 1px solid var(--rule); background: var(--panel); }
.bar-in { max-width: 1280px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.bar-name { font-weight: 700; font-size: 15px; margin-right: auto; }
.bar-name span { font-weight: 400; color: var(--muted); }
.key { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.key input { appearance: none; width: 34px; height: 20px; border-radius: 10px; background: var(--rule); position: relative; cursor: pointer; margin: 0; transition: background .15s; }
.key input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); transition: transform .15s; }
.key input:checked { background: var(--defend); }
.key input:checked::after { transform: translateX(14px); }
.bar a { font-size: 14px; }

/* ---- hero ---- */
.hero { max-width: 1280px; margin: 0 auto; padding: 48px 24px 28px; }
.hero-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 300px); gap: 40px; align-items: end; }
@media (max-width: 900px) { .hero-top { grid-template-columns: minmax(0, 1fr); gap: 24px; } }
.hero h1 { font-size: clamp(28px, 3.4vw, 42px); line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; max-width: 30ch; text-wrap: balance; }
.hero h1 .num-attack { color: var(--attack-text); }
.hero h1 .num-defend { color: var(--defend-text); }
.hero-sub { margin-top: 14px; max-width: 68ch; color: var(--ink-2); font-size: 17px; }
.hero-sub a { white-space: nowrap; }

.strip { margin-top: 30px; background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 14px 16px 10px; }
.strip-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
.strip-row { display: grid; grid-template-columns: minmax(150px, 230px) 1fr minmax(84px, 110px); align-items: center; gap: 14px;
             width: 100%; padding: 3px 6px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 3px; }
.strip-row:hover, .strip-row.current { background: var(--sunken); }
.strip-row .name { font-size: 14px; line-height: 1.25; }
.strip-row .name small { display: block; color: var(--muted); font-size: 12px; }
.strip-row svg { width: 100%; height: 30px; display: block; overflow: visible; }
.strip-row .score { font-size: 13px; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
.legend svg { vertical-align: -3px; margin-right: 6px; }
@media (max-width: 720px) {
  .strip-row { grid-template-columns: 1fr; gap: 2px; }
  .strip-row .score { text-align: left; }
}
.underlines { clip-path: inset(0 100% 0 0); }
.drawn .underlines { clip-path: inset(0 0 0 0); transition: clip-path 1.6s cubic-bezier(.3,.6,.2,1); }
@media (prefers-reduced-motion: reduce) { .drawn .underlines, .underlines { transition: none; clip-path: none; } }

.facts { display: grid; gap: 14px; font-size: 14px; color: var(--ink-2); border-left: 2px solid var(--rule); padding-left: 18px; }
.facts b { color: var(--ink); font-size: 22px; display: block; line-height: 1.2; }
@media (max-width: 900px) { .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---- workspace ---- */
.work { max-width: 1280px; margin: 0 auto; padding: 8px 24px 80px; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 32px; align-items: start; }
.rail { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 2px; border-left: 2px solid var(--rule); }
.rail button { text-align: left; background: none; border: 0; padding: 7px 12px; margin-left: -2px; border-left: 2px solid transparent; color: var(--ink-2); cursor: pointer; font-size: 15px; }
.rail button:hover { color: var(--ink); }
.rail button[aria-current="page"] { border-left-color: var(--defend); color: var(--ink); font-weight: 700; }
@media (max-width: 900px) {
  .work { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-left: 16px; padding-right: 16px; }
  .work > * { min-width: 0; }
  .rail { position: static; flex-direction: row; overflow-x: auto; border-left: 0; border-bottom: 2px solid var(--rule); }
  .hero, .bar-in, footer { padding-left: 16px; padding-right: 16px; }
  .rail button { white-space: nowrap; border-left: 0; border-bottom: 2px solid transparent; margin: 0 0 -2px; }
  .rail button[aria-current="page"] { border-bottom-color: var(--defend); }
}
.view h2 { font-size: 26px; line-height: 1.2; font-weight: 700; }
.view .intro { margin-top: 8px; max-width: 70ch; color: var(--ink-2); }
.view h3 { font-size: 18px; font-weight: 700; margin: 28px 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 13px; }

/* panels: flat surfaces with a hairline, radius only where something is an object */
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 16px 18px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--panel); padding: 6px 13px; border-radius: 4px; cursor: pointer; font-size: 14px; }
.btn:hover { border-color: var(--ink-2); }
.btn.go { background: var(--defend); border-color: var(--defend); color: #fff; font-weight: 700; }
.btn.go:hover { filter: brightness(1.08); }
a.btn { text-decoration: none; color: var(--ink); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* tags: plain text with a shape, never color alone */
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.tag.attack { color: var(--attack-text); font-weight: 700; }
.tag.open::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--defend); }
.tag.closed::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--tick); }
.sev { font-size: 13px; color: var(--ink-2); }
.sev::before { margin-right: 4px; }
.sev.high::before { content: "▲"; }
.sev.medium::before { content: "◆"; }
.tech { font-size: 13px; color: var(--ink-2); border: 1px solid var(--rule); border-radius: 3px; padding: 0 6px; }

/* ---- replay ---- */
.ds-pick { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0; }
.ds-pick button { border: 1px solid var(--rule); background: var(--panel); border-radius: 3px; padding: 4px 10px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.ds-pick button[aria-pressed="true"] { border-color: var(--defend); color: var(--defend-text); background: var(--defend-wash); font-weight: 700; }
.split { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 20px; align-items: start; margin-top: 16px; }
@media (max-width: 1100px) { .split { grid-template-columns: minmax(0, 1fr); } }
.split > * { min-width: 0; }
.timeline { width: 100%; height: auto; display: block; margin-top: 10px; }
.feed { max-height: 280px; overflow: auto; font-size: 14px; border-top: 1px solid var(--rule); }
.feed > div { padding: 6px 2px; border-bottom: 1px solid var(--rule); }
.feed .log { font-size: 12.5px; color: var(--muted); margin-right: 8px; }
.feed .fired { border-left: 3px solid var(--defend); padding-left: 10px; background: var(--defend-wash); }
.feed .fired.closed { border-left-color: var(--tick); background: var(--sunken); }
.feed .fired b { display: block; }
.empty { padding: 26px 8px; color: var(--muted); }

table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--panel); }
td { padding: 6px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr.pick { cursor: pointer; }
tr.pick:hover td { background: var(--sunken); }
tr.pick.selected td { background: var(--defend-wash); }
tr.pick.later td { opacity: .35; }
.scroll { max-height: 420px; overflow: auto; border: 1px solid var(--rule); border-radius: 4px; background: var(--panel); }
td.log { font-size: 12.5px; white-space: nowrap; }

.inspector { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
@media (max-width: 1100px) { .inspector { position: static; max-height: none; } }
.inspector .who { font-size: 18px; font-weight: 700; margin-top: 4px; word-break: break-word; }
.truth { margin-top: 10px; padding: 8px 10px; border-radius: 3px; background: var(--sunken); font-size: 14px; }
.alert-box { border-top: 1px solid var(--rule); padding: 10px 0; }
.check-table td { font-size: 13px; }
.check-table td.log { white-space: normal; word-break: break-all; }
.pass { color: var(--defend-text); font-weight: 700; }
.fail { color: var(--muted); }
.cond { font-family: var(--mono); font-size: 13px; background: var(--sunken); padding: 1px 6px; border-radius: 3px; }
details > summary { cursor: pointer; }
pre { background: var(--sunken); border-radius: 4px; padding: 10px 12px; overflow: auto; max-height: 380px; font-size: 12.5px; line-height: 1.5; margin: 8px 0 0; }

/* ---- queue ---- */
.queue-sum { display: flex; flex-wrap: wrap; gap: 10px 36px; margin: 18px 0 8px; font-size: 15px; color: var(--ink-2); }
.queue-sum b { display: block; font-size: 22px; color: var(--ink); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0; }
.filters select { font: inherit; font-size: 14px; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 4px; background: var(--panel); color: var(--ink); max-width: 100%; }
.alert-card { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; margin-bottom: 10px; }
.alert-card.open { border-left: 4px solid var(--defend); }
.alert-card .why { margin: 4px 0 8px; color: var(--ink-2); font-size: 15px; }
.ctx { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13.5px; color: var(--ink-2); }
.ctx .new { color: var(--ink); font-weight: 700; }
.group-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 26px 0 8px; }
.group-head h3 { margin: 0; }

/* ---- rules ---- */
.rule-row td { vertical-align: middle; }
.bars { width: 100%; height: 22px; display: block; }
.rule-detail td { background: var(--sunken); padding: 14px 16px; }
.tabs { display: flex; gap: 4px; margin: 10px 0 0; }
.tabs button { border: 1px solid var(--rule); background: var(--panel); border-radius: 3px; padding: 3px 10px; font-size: 13px; cursor: pointer; color: var(--ink-2); }
.tabs button[aria-selected="true"] { border-color: var(--defend); color: var(--defend-text); font-weight: 700; }

/* ---- coverage ---- */
.lanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 18px; }
@media (max-width: 900px) { .lanes { grid-template-columns: minmax(0, 1fr); } }
.lane h3 { margin: 0 0 8px; }
.tech-item { padding: 10px 0 10px 14px; border-left: 3px solid var(--rule); margin-bottom: 8px; }
.tech-item.tested { border-left-color: var(--defend); }
.tech-item .t-id { font-size: 13px; color: var(--muted); }
.tech-item .t-name { font-weight: 700; }
.tech-item .t-state { font-size: 13px; }
.tech-item.tested .t-state { color: var(--defend-text); }

/* ---- lifecycle: a real sequence, so it is numbered ---- */
.steps { list-style: none; padding: 0; margin: 20px 0 0; counter-reset: step; position: relative; }
.steps li { position: relative; padding: 0 0 26px 52px; counter-increment: step; }
.steps li::before { content: counter(step); position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 50%;
                    border: 2px solid var(--defend); color: var(--defend-text); font-weight: 700; display: grid; place-items: center; background: var(--surface); font-size: 14px; }
.steps li::after { content: ""; position: absolute; left: 15px; top: 34px; bottom: 2px; width: 2px; background: var(--rule); }
.steps li:last-child::after { display: none; }
.steps h3 { margin: 4px 0 4px; }
.steps p { max-width: 70ch; color: var(--ink-2); }
.steps .row { margin-top: 8px; }

.tooltip { position: fixed; z-index: 30; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 13px; padding: 7px 10px; border-radius: 4px; max-width: 320px; line-height: 1.4; display: none; }
footer { max-width: 1280px; margin: 0 auto; padding: 0 24px 40px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="bar">
  <div class="bar-in">
    <div class="bar-name">Identity-to-Data Detection Lab <span>by Anthony Bayate Jr.</span></div>
    <label class="key" title="Each event's true label (attack or normal) comes from the dataset's documentation. Analysts never see it. Switch it off to see the data the way a SOC does.">
      <input type="checkbox" id="answerKey" checked> Show answer key
    </label>
    <a href="https://github.com/abayate/identity-to-data-lab">Source code</a>
    <a href="https://github.com/abayate/identity-to-data-lab/blob/main/docs/06-findings-report.md">Findings report</a>
  </div>
</div>

<section class="hero" id="hero"></section>
<div class="work">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main class="view" id="view"></main>
</div>
<footer id="footer"></footer>
<div class="tooltip" id="tip" role="tooltip"></div>

<script>
// All results are embedded below by harness/dashboard.py. No server and no external scripts.
const D = /*__DASHBOARD_DATA__*/null;

// ---------------------------------------------------------------------------
// DOM helper. Log fields are attacker-controlled (user agents, search text, file
// names), so data only ever enters the page as text, never as HTML. That is what
// keeps a malicious log line from injecting code into this page (stored XSS).
// ---------------------------------------------------------------------------
function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) node.setAttribute(k, v === true ? "" : v);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}
function svg(tag, attrs = {}) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
}
const fmt = n => Number(n).toLocaleString("en-US");
const pct = x => (x * 100).toFixed(1) + "%";
const when = t => (t || "").replace("T", " ").replace(/\.\d+Z$/, "").replace(/Z$/, "");

// ---------------------------------------------------------------------------
// Indexes and plain-language names
// ---------------------------------------------------------------------------
const ruleByKey = Object.fromEntries(D.rules.map(r => [r.key, r]));
const alertsByEvent = {};
for (const a of D.alerts) for (const i of a.events) (alertsByEvent[i] ||= []).push(a);
const eventsByDataset = {};
D.events.forEach((e, i) => { if (e.ds) (eventsByDataset[e.ds] ||= []).push(i); });
for (const ds in eventsByDataset) eventsByDataset[ds].sort((a, b) => D.events[a].t.localeCompare(D.events[b].t));

const DATASET_TITLES = {
  aitm_session_cookie_replay: ["Stolen session replayed", "Evilginx, Entra ID sign-ins"],
  aitm_session_cookie_replay_m365: ["Stolen session, then mailbox read", "Evilginx, Entra ID + Microsoft 365"],
  device_code_phishing: ["Device-code phishing", "TokenTactics, Entra ID"],
  oauth_consent_grant: ["Malicious app consent", "365-Stealer, Entra ID"],
  sharepoint_mass_download: ["SharePoint data theft", "browser, zip, sync client, rclone"],
  sharepoint_sensitive_search: ["Searching for secrets", "SharePoint and Microsoft Search"],
  aws_leaked_key_discovery: ["Leaked key enumerates AWS", "CloudSploit, CloudMapper"],
  aws_create_access_key_for_other_user: ["Access key minted for another user", "Atomic Red Team, plus real admin work"],
  aws_policy_version_privesc: ["Policy rewritten to admin", "IAM privilege escalation"],
  aws_role_external_trust: ["Backdoor role for an outside account", "IAM persistence"],
  aws_s3_mass_getobject: ["S3 bucket copied out", "CloudTrail data events"],
  aws_ebs_snapshot_share: ["Disk snapshot shared out", "Stratus Red Team"],
};
const LOG_NAMES = { entra_signins: "Entra sign-ins", entra_audit: "Entra audit", m365_audit: "Microsoft 365 audit", cloudtrail: "AWS CloudTrail" };
const GAP_REASONS = {
  "T1566": "The phishing email itself lives in mail-flow logs, which this lab doesn't ingest.",
  "T1539": "The cookie is stolen on the attacker's own proxy, so no victim log records it.",
  "T1552.001": "The key leaks outside AWS (for example, pushed to GitHub), so CloudTrail has no event.",
};
const LEVEL_ORDER = { critical: 0, high: 1, medium: 2, low: 3, informational: 4 };
const LOGIC_NAMES = { "single event": "One event", event_count: "Counts events over time", value_count: "Counts distinct values over time", temporal: "Links two rules in time" };
const logicName = type => LOGIC_NAMES[type] || type;
const dsTitle = name => (DATASET_TITLES[name] || [name.replaceAll("_", " ")])[0];

const state = { view: "replay", answerKey: true, dataset: "aitm_session_cookie_replay_m365",
                event: null, shown: null, play: null, ruleFilter: "", status: "open", openRule: null, techFilter: null };

// ---------------------------------------------------------------------------
// Tooltip (hover help on the evidence strip and the timeline)
// ---------------------------------------------------------------------------
const tip = document.getElementById("tip");
function showTip(evt, lines) {
  tip.replaceChildren(...lines.filter(Boolean).map((line, i) => el("div", i === 0 ? { style: "font-weight:700" } : {}, line)));
  tip.style.display = "block";
  const x = Math.min(evt.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
  const y = Math.min(evt.clientY + 14, window.innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.display = "none"; };

// ---------------------------------------------------------------------------
// Hero: the headline result and the evidence strip
// ---------------------------------------------------------------------------
function renderHero() {
  const s = D.summary;
  const strip = el("div", { class: "strip", id: "strip" },
    el("div", { class: "strip-head" },
      el("span", {}, "Every real event in the lab, one row per attack. Select a row to replay it below."),
      el("span", {}, "Detected / attacker events")),
    D.datasets.map(stripRow),
    el("div", { class: "legend" },
      el("span", {}, legendTick("attack"), state.answerKey ? "Attacker event" : "Event (answer key hidden)"),
      el("span", {}, legendTick("normal"), "Normal activity"),
      el("span", {}, legendTick("detected"), "Part of an alert")));
  document.getElementById("hero").replaceChildren(
    el("div", { class: "hero-top" },
      el("div", {},
        el("h1", {},
          el("span", { class: "num-attack" }, fmt(s.malicious) + " attacker events"),
          " were hidden in " + fmt(s.events) + " real logs. Thirteen detections caught ",
          el("span", { class: "num-defend" }, fmt(s.caught)), "."),
        el("p", { class: "hero-sub" },
          "Nothing here is simulated. Splunk's Threat Research Team recorded these logs while real attack tools ran against Microsoft 365 and AWS test tenants, and published them as ",

          el("td", { class: "small", style: "white-space:nowrap" }, `${fmt(r.stats.true_positives)} real`, el("br"),
             r.stats.false_positives ? `${fmt(r.stats.false_positives)} false, ${fmt(r.stats.false_positives - r.stats.auto_closed)} open` : "0 false"),
          el("td", { style: "width:40%" }, ruleBar(r, max)))];
        if (open) rows.push(el("tr", { class: "rule-detail" }, el("td", { colspan: 4 }, ruleDetail(r))));
        return rows;
      })))));
}
function legendBar(color) {
  const s = svg("svg", { width: 22, height: 12, "aria-hidden": "true" });
  s.append(svg("rect", { x: 1, y: 2, width: 20, height: 8, rx: 2, fill: color === "hollow" ? "none" : color,
                         stroke: color === "hollow" ? "var(--tick)" : "none", "stroke-width": 1.5 }));
  return s;
}
function ruleBar(r, max) {
  const W = 300, H = 22, tp = r.stats.true_positives, fpOpen = r.stats.false_positives - r.stats.auto_closed, closed = r.stats.auto_closed;
  const scale = v => v / max * (W - 40);
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, class: "bars", role: "img",
    "aria-label": `${tp} alerts on real attacks, ${fpOpen} open false positives, ${closed} auto-closed false positives` });
  let x0 = 0;
  const seg = (v, fill, hollow) => {
    if (!v) return;
    const w = Math.max(2, scale(v) - 2);  // 2px surface gap between segments
    s.append(svg("rect", { x: x0 + (hollow ? 0.75 : 0), y: 4, width: w, height: 14, rx: 2, fill: hollow ? "none" : fill,
                           stroke: hollow ? "var(--tick)" : "none", "stroke-width": 1.5 }));
    x0 += w + 2;
  };
  seg(tp, "var(--defend)"); seg(fpOpen, "var(--tick)"); seg(closed, null, true);
  const label = svg("text", { x: x0 + 4, y: 16, "font-size": 12, fill: "var(--ink-2)" });
  label.textContent = fmt(r.stats.hits);
  s.append(label);
  return s;
}
function ruleDetail(r) {
  const body = el("div", {});
  const tabs = el("div", { class: "tabs", role: "tablist" });
  const show = which => {
    tabs.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b.dataset.k === which ? "true" : "false"));
    body.replaceChildren(which === "sigma" ? el("pre", {}, r.sigma) : which === "kql" ? el("pre", {}, r.kql || "No KQL section found in the docs.")
      : el("ul", { class: "small" }, r.falsepositives.map(f => el("li", {}, f))));
  };
  [["sigma", "Sigma rule"], ["kql", "KQL for Sentinel"], ["fp", "Expected false positives"]].forEach(([k, l]) =>
    tabs.append(el("button", { role: "tab", "data-k": k, onclick: ev => { ev.stopPropagation(); show(k); } }, l)));
  show("sigma");
  return el("div", { onclick: ev => ev.stopPropagation() },
    el("p", { style: "max-width:75ch" }, r.description),
    r.stats.false_positives ? el("p", { class: "small", style: "margin-top:6px" },
      `False-positive rate ${pct(r.stats.fp_rate)} before triage, ${pct(r.stats.fp_rate_after_triage)} after.`) : null,
    el("div", { class: "row", style: "margin-top:8px" },
      el("button", { class: "btn", onclick: () => go("queue", { ruleFilter: r.key, status: "all" }) }, "See this rule's alerts"),
      el("a", { class: "btn", href: "https://github.com/abayate/identity-to-data-lab/blob/main/" + r.key }, "Open the file on GitHub")),
    tabs, body);
}

    ["Get real data", `${D.datasets.length} published datasets of real attack telemetry, ${fmt(s.events)} events in all, committed unmodified with their Apache-2.0 license so every result can be reproduced offline.`,

    ["Tune the noise", key ? `The access-key rule also fired on 28 real admin actions, a ${pct(key.stats.fp_rate)} false-positive rate. One documented auto-close rule for the approved admin workflow brought it to ${pct(key.stats.fp_rate_after_triage)}, and a test makes sure it never hides a real attack.` : "Documented auto-close rules.",
