title: Entra ID Successful User Sign-In
name: entra_successful_user_signin
id: d44aefb1-5669-4377-bb62-2150b0afd019
status: experimental
description: Base rule. A successful sign-in by a user (not a service principal).
author: identity-to-data-lab
date: 2026-10-21
logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    ResultType: '0'
  filter_no_user:
    UserPrincipalName: null
  condition: selection and not filter_no_user
level: informational
