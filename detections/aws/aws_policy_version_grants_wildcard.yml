title: AWS IAM Policy Version Set as Default With Wildcard Actions
id: 911c024c-d351-4026-8b52-b9ba4dadef0c
status: experimental
description: >
  Detects CreatePolicyVersion with setAsDefault true where the new policy allows every
  action ("*") or every IAM action ("iam:*"). A user who can edit a policy attached to
  themself can rewrite it to grant full admin in one call; this is one of the best-known
  AWS privilege-escalation paths. Production policies are rarely edited to wildcards.
references:
  - https://rhinosecuritylabs.com/aws/aws-privilege-escalation-methods-mitigation/
  - https://github.com/splunk/attack_data/tree/master/datasets/attack_techniques/T1078/aws_create_policy_version
author: identity-to-data-lab
date: 2026-10-21
tags:
  - attack.privilege_escalation
  - attack.t1098.003
  - attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventSource: iam.amazonaws.com
    eventName: CreatePolicyVersion
    requestParameters.setAsDefault: true
    requestParameters.policyDocument|re: '"Action"\s*:\s*(\[[^\]]*)?"(\*|iam:\*)"'
  condition: selection
falsepositives:
  - Break-glass or sandbox-account admin policies being (re)written on purpose
  - A policy that grants a whole service (e.g. "s3:*") is not matched; only full or IAM-wide wildcards
level: high
