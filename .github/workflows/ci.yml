name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Replay sample logs through all rules
        # Prints the per-rule TP/FP table and adds it to this run's summary page.
        run: python harness/replay.py

      - name: Check committed reports are up to date
        # replay.py just rewrote reports/. If they differ from what's committed, someone changed
        # rules or data without re-running the replay, so the README numbers would be stale.
        run: git diff --exit-code -- reports/
